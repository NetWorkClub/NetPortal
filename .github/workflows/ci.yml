name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test-and-vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install GTK and WebKit2GTK 4.1 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Run Go tests
        run: go test -race -tags webkit2_41 ./core/... ./desktop/...
      - name: Run Go vet
        run: go vet -tags webkit2_41 ./core/... ./desktop/...
      - name: Build daemon
        run: go build ./core/cmd/netportal-daemon

  ui-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install and build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

  linux-desktop-build:
    needs: ui-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install WebKit2GTK 4.1 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Build UI bundle into desktop/frontend/dist
        working-directory: ui
        run: |
          npm ci
          npm run build
          rm -rf ../desktop/frontend/dist/*
          cp -r dist/netportal-ui/browser/* ../desktop/frontend/dist/
      - name: Build desktop binary with webkit2_41 tag
        working-directory: desktop
        run: go build -tags webkit2_41 -o ../netportal .
