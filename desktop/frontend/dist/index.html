<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title>NetPortal</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f17; color: #e2e8f0; display: grid; place-items: center; height: 100vh; }
    .box { text-align: center; max-width: 420px; padding: 24px; border: 1px solid #1e293b; border-radius: 12px; background: #111827; }
    code { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <h2>NetPortal Desktop Shell</h2>
    <p>Build <code>ui/</code> and copy its browser bundle into <code>desktop/frontend/dist</code> to launch the full Angular UI.</p>
  </div>
</body>
</html>
