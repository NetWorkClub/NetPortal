<dialog
  #dlg
  class="dialog"
  closedby="any"
  aria-labelledby="dlg-add-title"
  (close)="onNativeClose()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
>
  <div class="dialog-head">
    <h2 id="dlg-add-title">{{ 'dialogs.addTitle' | t }}</h2>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" (click)="closeDialog()" [attr.aria-label]="'common.cancel' | t">
      <np-icon name="close" [size]="16" />
    </button>
  </div>

  <div class="dialog-body">
    <div class="action-tiles">
      <button type="button" class="action-tile" (click)="fillFromClipboard()">
        <np-icon name="clipboard" [size]="20" />
        <strong>{{ 'dialogs.tileClipboard' | t }}</strong>
        <span>{{ 'dialogs.tileClipboardHint' | t }}</span>
      </button>

      <button type="button" class="action-tile" (click)="triggerFilePicker()">
        <np-icon name="file" [size]="20" />
        <strong>{{ 'dialogs.tileFile' | t }}</strong>
        <span>{{ 'dialogs.tileFileHint' | t }}</span>
      </button>

      <button type="button" class="action-tile" (click)="openGeneratorFromAdd()">
        <np-icon name="spark" [size]="20" />
        <strong>{{ 'dialogs.tileGen' | t }}</strong>
        <span>{{ 'dialogs.tileGenHint' | t }}</span>
      </button>
    </div>

    <input
      #fileInput
      type="file"
      accept=".conf,.json,.yaml,.yml,.txt,.vpn"
      hidden
      (change)="onFileSelected($event)"
    />

    <div class="field">
      <label class="field-label" for="import-name-input">{{ 'dialogs.importName' | t }}</label>
      <input
        id="import-name-input"
        type="text"
        class="input"
        [ngModel]="nameInput()"
        (ngModelChange)="nameInput.set($event)"
        placeholder="Main Subscription / Home AWG 3.1"
      />
    </div>

    <div class="field">
      <label class="field-label" for="import-raw-textarea">{{ 'dialogs.importRaw' | t }}</label>
      <textarea
        id="import-raw-textarea"
        class="textarea mono"
        [ngModel]="rawInput()"
        (ngModelChange)="rawInput.set($event); fileName.set('')"
        placeholder="vless://... | masque://... | [Interface] ... | proxies:"
      ></textarea>
      <p class="setting-desc" style="margin-top: 6px;">{{ detectLabel() }}</p>
    </div>
  </div>

  <div class="dialog-actions">
    <button type="button" class="btn btn-secondary" (click)="closeDialog()">{{ 'common.cancel' | t }}</button>
    <button type="button" class="btn btn-primary" (click)="submitImport()">{{ 'dialogs.importSubmit' | t }}</button>
  </div>
</dialog>
